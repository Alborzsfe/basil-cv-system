[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basil-cv-system"
version = "1.0.0"
description = "Reproducible computer-vision pipeline for basil leaf segmentation and disease classification"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alborz Seifaei" }]
keywords = ["basil", "computer-vision", "plant-disease", "pytorch", "segmentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<6",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "Pillow>=10,<13",
  "matplotlib>=3.8,<4",
  "PyYAML>=6,<7",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
ml = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.urls]
Repository = "https://github.com/Alborzsfe/basil-cv-system"
Issues = "https://github.com/Alborzsfe/basil-cv-system/issues"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
