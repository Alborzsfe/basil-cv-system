name: Bug report
description: Report a reproducible software defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach private images, credentials, plant identifiers, or untrusted checkpoints."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, sanitized configuration, and smallest example.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, OS, PyTorch, device, and relevant dependency versions.
    validations:
      required: true
